<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nuestro rompecabezas</title>
<meta name="theme-color" content="#f7c6d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="../personalizar/fotos/fruta-11.png">
<link rel="apple-touch-icon" href="../personalizar/fotos/fruta-11.png">
<script src="config.js" charset="utf-8"></script>
<style>
:root { --rosa: #e8547a; --rosa-suave: #f7c6d0; --crema: #fff6f0; --texto: #5a2d3a; --sombra: rgba(120, 30, 60, .18); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto);
  background: linear-gradient(160deg, #ffe3ea 0%, #ffd6c9 55%, #fbe7c6 100%); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
#corazones { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#corazones i { position: absolute; bottom: -40px; font-style: normal; opacity: .55; animation: subir linear infinite; }
@keyframes subir { to { transform: translateY(-115vh) rotate(25deg); } }
.pantalla { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; z-index: 1;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); }
.pantalla.activa { display: flex; }
h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); color: var(--rosa); text-align: center; text-shadow: 0 2px 0 #fff; }
.para { font-size: 18px; margin-top: 4px; font-weight: 700; }
.suave { opacity: .75; text-align: center; }
.boton { background: var(--rosa); color: #fff; font-weight: 800; font-size: 18px; padding: 14px 28px; border-radius: 999px;
  box-shadow: 0 6px 0 #b8345a, 0 10px 20px var(--sombra); transition: transform .08s; }
.boton:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8345a; }
.boton.blanco { background: #fff; color: var(--rosa); box-shadow: 0 6px 0 #e7b6c4, 0 10px 20px var(--sombra); }

/* inicio: niveles */
#niveles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: 100%; max-width: 460px;
  margin: 22px 0; overflow-y: auto; padding: 4px; }
.nivel { aspect-ratio: 1; border-radius: 22px; background: #fff; box-shadow: 0 6px 16px var(--sombra); position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: var(--rosa); }
.nivel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.nivel .etq { position: absolute; left: 6px; bottom: 6px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 2px 9px; font-size: 13px; }
.nivel.bloqueado { opacity: .55; }

/* juego */
#barra { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#barra .chip { background: rgba(255,255,255,.85); border-radius: 999px; padding: 8px 14px; font-weight: 800; box-shadow: 0 3px 10px var(--sombra); }
#tablero-caja { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
#tablero { position: relative; width: min(92vw, 62vh, 460px); aspect-ratio: 1; background: #fff; border-radius: 22px; padding: 8px;
  box-shadow: 0 12px 30px var(--sombra); touch-action: none; }
#tablero .dentro { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: #f3dde3; }
.pieza { position: absolute; border-radius: 8px; transition: transform .14s ease-out, border-radius .4s, box-shadow .4s;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.75); background-repeat: no-repeat; }
#tablero.listo .pieza { border-radius: 0; box-shadow: none; }
#vistazo { position: absolute; inset: 8px; border-radius: 14px; background-size: cover; opacity: 0; transition: opacity .15s; pointer-events: none; }
#vistazo.visible { opacity: 1; }
#acciones { display: flex; gap: 12px; margin-top: 14px; }

/* mensaje */
#tarjeta { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5; padding: 24px;
  background: rgba(90, 45, 58, .35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
#tarjeta.visible { display: flex; }
#tarjeta .papel { background: var(--crema); border-radius: 26px; padding: 22px; max-width: 380px; width: 100%; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: entrar .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes entrar { from { transform: scale(.7); opacity: 0; } }
#tarjeta img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 18px; }
#tarjeta .mensaje { font-size: 22px; font-weight: 800; margin: 16px 6px 6px; line-height: 1.3; }
#tarjeta .datos { font-size: 14px; opacity: .7; margin-bottom: 16px; }
.lluvia { position: fixed; z-index: 6; pointer-events: none; font-size: 26px; animation: caer 1.6s ease-out forwards; }
@keyframes caer { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
#final .collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(90vw, 380px); margin: 18px 0; }
#final .collage img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; box-shadow: 0 4px 12px var(--sombra); }
</style>
</head>
<body>
<div id="corazones"></div>

<section id="inicio" class="pantalla activa">
  <h1 id="titulo"></h1>
  <div class="para" id="para"></div>
  <div class="suave" id="texto-inicio" style="margin-top:8px"></div>
  <div id="niveles"></div>
  <button class="boton blanco" id="ir-otro" style="display:none"></button>
</section>

<section id="juego" class="pantalla">
  <div id="barra">
    <button class="chip" id="volver">← Fotos</button>
    <span class="chip" id="info-nivel"></span>
    <span class="chip" id="movidas">0</span>
  </div>
  <div id="tablero-caja"><div id="tablero"><div class="dentro"></div><div id="vistazo"></div></div></div>
  <div id="acciones">
    <button class="boton blanco" id="ver">👀 Ver foto</button>
    <button class="boton blanco" id="mezclar">🔀 Mezclar</button>
  </div>
</section>

<section id="final" class="pantalla">
  <h1>❤</h1>
  <div class="para" id="texto-final" style="text-align:center;font-size:24px"></div>
  <div class="collage" id="collage"></div>
  <button class="boton" id="otra-vez">Volver a las fotos</button>
</section>

<div id="tarjeta"><div class="papel">
  <img id="tarjeta-foto" alt="">
  <div class="mensaje" id="tarjeta-mensaje"></div>
  <div class="datos" id="tarjeta-datos"></div>
  <button class="boton" id="siguiente">Siguiente foto ❤</button>
</div></div>

<script>
"use strict";
const C = Object.assign({ titulo: "Nuestro rompecabezas", para: "", inicio: "", niveles: [], final: "❤", enlaceOtroJuego: "", textoOtroJuego: "" },
                        window.ROMPECABEZAS || {});
const $ = s => document.querySelector(s);
const guardar = (k, v) => { try { localStorage.setItem("rompecabezas-" + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem("rompecabezas-" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
let hechos = leer("hechos", {});                // índice de nivel -> {movidas, segundos}

/* --- corazones de fondo --- */
for (let i = 0; i < 14; i++) {
  const c = document.createElement("i");
  c.textContent = ["❤", "💕", "💗", "✨"][i % 4];
  c.style.left = Math.random() * 100 + "%";
  c.style.fontSize = 14 + Math.random() * 18 + "px";
  c.style.animationDuration = 9 + Math.random() * 10 + "s";
  c.style.animationDelay = -Math.random() * 15 + "s";
  $("#corazones").appendChild(c);
}

/* --- fotos: el cuadrado del centro, como imagen lista para cortar --- */
const cuadradas = {};
function fotoCuadrada(ruta) {
  if (cuadradas[ruta]) return cuadradas[ruta];
  return cuadradas[ruta] = new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.naturalWidth, img.naturalHeight), n = Math.min(900, lado);
      const c = document.createElement("canvas"); c.width = c.height = n;
      const g = c.getContext("2d");
      g.fillStyle = "#f3dde3"; g.fillRect(0, 0, n, n);
      g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, n, n);
      try { ok(c.toDataURL("image/jpeg", .9)); } catch (e) { ok(ruta); }
    };
    img.onerror = () => ok(null);
    img.src = ruta;
  });
}

/* --- inicio --- */
$("#titulo").textContent = C.titulo;
$("#para").textContent = C.para;
$("#texto-inicio").textContent = C.inicio;
document.title = C.titulo;
if (C.enlaceOtroJuego) { const b = $("#ir-otro"); b.style.display = ""; b.textContent = C.textoOtroJuego || "Otro juego"; b.onclick = () => location.href = C.enlaceOtroJuego; }

function mostrar(id) { document.querySelectorAll(".pantalla").forEach(p => p.classList.toggle("activa", p.id === id)); }
async function pintarNiveles() {
  const caja = $("#niveles"); caja.innerHTML = "";
  for (let i = 0; i < C.niveles.length; i++) {
    const nv = C.niveles[i], abierto = i === 0 || hechos[i - 1] || hechos[i];
    const b = document.createElement("button");
    b.className = "nivel" + (abierto ? "" : " bloqueado");
    b.innerHTML = abierto ? (hechos[i] ? "" : String(i + 1)) : "🔒";
    if (hechos[i]) { const im = document.createElement("img"); fotoCuadrada(nv.foto).then(u => u && (im.src = u)); b.appendChild(im); }
    const e = document.createElement("span"); e.className = "etq";
    e.textContent = hechos[i] ? "✓ " + (nv.piezas || 3) + "×" + (nv.piezas || 3) : (nv.piezas || 3) + "×" + (nv.piezas || 3);
    b.appendChild(e);
    b.onclick = () => abierto ? empezar(i) : vibrar([30, 40, 30]);
    caja.appendChild(b);
  }
}

/* --- juego --- */
let nivel = 0, N = 3, orden = [], vacio = 0, movidas = 0, t0 = 0, terminado = false, piezas = [];
const tablero = $("#tablero"), dentro = $("#tablero .dentro");

async function empezar(i) {
  nivel = i; N = Math.max(2, Math.min(6, C.niveles[i].piezas || 3));
  const url = await fotoCuadrada(C.niveles[i].foto);
  if (!url) { alert("No encuentro la foto «" + C.niveles[i].foto + "». Revisa el nombre en config.js."); return; }
  $("#info-nivel").textContent = "Foto " + (i + 1) + " de " + C.niveles.length;
  $("#vistazo").style.backgroundImage = `url("${url}")`;
  dentro.innerHTML = ""; piezas = [];
  for (let k = 0; k < N * N - 1; k++) {
    const p = document.createElement("div");
    p.className = "pieza";
    p.style.width = p.style.height = 100 / N + "%";
    p.style.backgroundImage = `url("${url}")`;
    p.style.backgroundSize = N * 100 + "%";
    p.style.backgroundPosition = `${(k % N) / (N - 1) * 100}% ${Math.floor(k / N) / (N - 1) * 100}%`;
    p.dataset.k = k;
    dentro.appendChild(p); piezas.push(p);
  }
  mostrar("juego");
  mezclar();
}
function mezclar() {
  orden = [...Array(N * N).keys()]; vacio = N * N - 1;       // orden[casilla] = pieza; N*N-1 = hueco
  let antes = -1;
  for (let k = 0; k < N * N * 40; k++) {                     // movidas al azar desde resuelto: siempre tiene solución
    const v = vecinos(vacio).filter(c => c !== antes);
    const c = v[Math.floor(Math.random() * v.length)];
    antes = vacio; mover(c, true);
  }
  if (resuelto()) return mezclar();
  movidas = 0; t0 = Date.now(); terminado = false;
  tablero.classList.remove("listo");
  $("#movidas").textContent = "0 movidas";
  pintar();
}
function vecinos(c) {
  const f = Math.floor(c / N), co = c % N, v = [];
  if (f > 0) v.push(c - N); if (f < N - 1) v.push(c + N);
  if (co > 0) v.push(c - 1); if (co < N - 1) v.push(c + 1);
  return v;
}
function mover(c, silencio) { orden[vacio] = orden[c]; orden[c] = N * N - 1; vacio = c; if (!silencio) movidas++; }
function pintar() {
  orden.forEach((pz, c) => {
    if (pz === N * N - 1) return;
    piezas[pz].style.transform = `translate(${(c % N) * 100}%, ${Math.floor(c / N) * 100}%)`;
  });
}
function resuelto() { return orden.every((pz, c) => pz === c); }
function tocar(c) {
  if (terminado) return;
  const fv = Math.floor(vacio / N), cv = vacio % N, f = Math.floor(c / N), co = c % N;
  if (f !== fv && co !== cv) return;
  // se corre toda la fila o columna hasta el hueco (como un rompecabezas de verdad)
  const paso = f === fv ? (co > cv ? 1 : -1) : (f > fv ? N : -N);
  while (vacio !== c) mover(vacio + paso);
  vibrar(8);
  $("#movidas").textContent = movidas + (movidas === 1 ? " movida" : " movidas");
  pintar();
  if (resuelto()) ganar();
}
tablero.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const r = dentro.getBoundingClientRect();
  const co = Math.floor((ev.clientX - r.left) / (r.width / N)), f = Math.floor((ev.clientY - r.top) / (r.height / N));
  if (co >= 0 && co < N && f >= 0 && f < N) tocar(f * N + co);
});

/* --- ver la foto completa mientras se mantiene apretado --- */
const ver = $("#ver"), vistazo = $("#vistazo");
ver.addEventListener("pointerdown", ev => { ev.preventDefault(); vistazo.classList.add("visible"); });
["pointerup", "pointerleave", "pointercancel"].forEach(t => ver.addEventListener(t, () => vistazo.classList.remove("visible")));
$("#mezclar").onclick = () => { if (!terminado || confirm("¿Mezclar de nuevo?")) mezclar(); };
$("#volver").onclick = () => { pintarNiveles(); mostrar("inicio"); };

/* --- terminar una foto --- */
function lluvia() {
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("div");
    s.className = "lluvia"; s.textContent = ["❤", "💖", "💕", "✨"][i % 4];
    s.style.left = 50 + (Math.random() - .5) * 20 + "vw"; s.style.top = "45vh";
    s.style.setProperty("--dx", (Math.random() - .5) * 90 + "vw");
    s.style.setProperty("--dy", -20 - Math.random() * 50 + "vh");
    s.style.setProperty("--r", (Math.random() - .5) * 120 + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1700);
  }
}
async function ganar() {
  terminado = true;
  const seg = Math.round((Date.now() - t0) / 1000);
  hechos[nivel] = { movidas, segundos: seg }; guardar("hechos", hechos);
  tablero.classList.add("listo"); vibrar([20, 60, 20, 60, 40]);
  setTimeout(async () => {
    $("#tarjeta-foto").src = await fotoCuadrada(C.niveles[nivel].foto);
    $("#tarjeta-mensaje").textContent = C.niveles[nivel].mensaje || "❤";
    $("#tarjeta-datos").textContent = `${movidas} movidas · ${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
    $("#siguiente").textContent = nivel + 1 < C.niveles.length ? "Siguiente foto ❤" : "Ver el final ❤";
    $("#tarjeta").classList.add("visible"); lluvia();
  }, 700);
}
$("#siguiente").onclick = () => {
  $("#tarjeta").classList.remove("visible");
  if (nivel + 1 < C.niveles.length) empezar(nivel + 1); else terminarTodo();
};
async function terminarTodo() {
  $("#texto-final").textContent = C.final;
  const col = $("#collage"); col.innerHTML = "";
  for (const nv of C.niveles) { const im = document.createElement("img"); im.src = (await fotoCuadrada(nv.foto)) || ""; col.appendChild(im); }
  mostrar("final"); lluvia(); setTimeout(lluvia, 600);
}
$("#otra-vez").onclick = () => { pintarNiveles(); mostrar("inicio"); };

/* sin zoom por doble toque ni pellizco (Safari del iPhone ignora user-scalable=no) */
let ultimo = 0;
document.addEventListener("touchend", ev => { const t = Date.now(); if (t - ultimo < 350) ev.preventDefault(); ultimo = t; }, { passive: false });
["gesturestart", "gesturechange", "dblclick"].forEach(t => document.addEventListener(t, ev => ev.preventDefault(), { passive: false }));

pintarNiveles();
</script>
</body>
</html>
