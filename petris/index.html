<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root { --noche:#140f22; --noche2:#251a3f; --tablero:#0f0b1a; --vidrio:rgba(255,255,255,.07); --vidrio2:rgba(255,255,255,.12); --borde:rgba(255,255,255,.12);
  --texto:#fff5ec; --suave:rgba(255,245,236,.62); --rosa:#ff6f91; --rosa-osc:#c7466a; --dorado:#ffc75f;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif; --cuerpo:"Nunito",ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
html,body { margin:0; height:100%; overflow:hidden; touch-action:none; }
body { font-family:var(--cuerpo); color:var(--texto); display:flex; flex-direction:column;
  background: radial-gradient(90% 60% at 15% 0%, rgba(255,111,145,.18), transparent 60%), radial-gradient(80% 50% at 100% 100%, rgba(255,199,95,.12), transparent 60%), linear-gradient(180deg,var(--noche2),var(--noche));
  padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); }
button { font:inherit; color:inherit; border:0; cursor:pointer; background:none; }
a { color:inherit; }

#barra { display:flex; align-items:center; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; background:var(--vidrio); border:1px solid var(--borde); border-radius:999px; padding:8px 14px; font-weight:800; font-size:14px; text-decoration:none; }
.chip:active { background:var(--vidrio2); }
.titulo { flex:1; text-align:center; font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:.01em; }
.titulo span { color:var(--rosa); }
.ico { width:38px; height:38px; justify-content:center; padding:0; font-size:16px; }

#zona { flex:1; min-height:0; display:flex; gap:10px; justify-content:center; align-items:center; padding:10px 0 0; }
#marco { position:relative; border-radius:18px; padding:4px; background:linear-gradient(160deg,rgba(255,111,145,.55),rgba(255,199,95,.35) 50%,rgba(255,255,255,.08));
  box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 60px rgba(255,111,145,.12); }
#tablero { display:block; border-radius:14px; background: radial-gradient(120% 70% at 50% 0%, #1d1530, var(--tablero)); touch-action:none; }
#lado { display:flex; flex-direction:column; gap:8px; width:84px; }
.caja { background:var(--vidrio); border:1px solid var(--borde); border-radius:16px; padding:9px 6px; text-align:center; }
.caja small { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--suave); font-weight:900; }
.caja b { display:block; font-family:var(--display); font-weight:600; font-size:20px; margin-top:2px; font-variant-numeric:tabular-nums; }
.caja.oro b { color:var(--dorado); }
#prox { display:block; margin:4px auto 0; }

#controles { display:grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; gap:8px; margin-top:12px; }
.btn { height:60px; border-radius:20px; background:var(--vidrio); border:1px solid var(--borde); display:grid; place-items:center; box-shadow:0 4px 0 rgba(0,0,0,.35); transition:transform .05s; }
.btn svg { width:26px; height:26px; }
.btn:active, .btn.on { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); background:var(--vidrio2); }
.btn.grande { background:linear-gradient(180deg,#ff86a3,var(--rosa)); border-color:transparent; box-shadow:0 4px 0 var(--rosa-osc), 0 8px 20px rgba(255,111,145,.35); }
.btn.grande:active { box-shadow:0 1px 0 var(--rosa-osc); }

.capa { position:fixed; inset:0; display:none; place-items:center; z-index:5; padding:20px;
  background: radial-gradient(80% 60% at 50% 30%, rgba(255,111,145,.25), transparent 70%), rgba(14,10,24,.78); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.capa.ver { display:grid; }
.carta { width:min(420px,100%); text-align:center; }
.carta h1 { margin:0; font-family:var(--display); font-weight:700; font-size:58px; line-height:1; letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff,#ffd3de); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 0 var(--rosa-osc)); }
.carta h2 { margin:0 0 6px; font-family:var(--display); font-weight:600; font-size:30px; }
.carta .lema { color:var(--suave); margin:8px 0 0; font-weight:700; }
.portada { display:block; width:100%; border-radius:22px; box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 50px rgba(120,80,255,.25); border:1px solid rgba(255,255,255,.15); }
@keyframes flota { 50% { translate:0 -6px; } }
.reglas { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0 18px; text-align:left; }
.reglas div { background:var(--vidrio); border:1px solid var(--borde); border-radius:14px; padding:9px 10px; font-size:13px; line-height:1.3; color:var(--suave); }
.reglas b { color:var(--texto); display:block; font-size:14px; }
.boton { display:inline-flex; justify-content:center; align-items:center; gap:8px; min-width:200px; background:linear-gradient(180deg,#ff86a3,var(--rosa)); color:#fff; font-family:var(--display); font-weight:600; font-size:20px;
  padding:15px 30px; border-radius:999px; box-shadow:0 5px 0 var(--rosa-osc), 0 12px 30px rgba(255,111,145,.35); text-decoration:none; margin:6px 4px 0; }
.boton:active { transform:translateY(4px); box-shadow:0 1px 0 var(--rosa-osc); }
.boton.vidrio { background:var(--vidrio); border:1px solid var(--borde); box-shadow:none; font-size:17px; padding:12px 24px; min-width:0; }
.boton[aria-disabled=true] { opacity:.6; pointer-events:none; }
.record { display:inline-block; background:var(--dorado); color:#4a2f00; font-weight:900; font-size:12px; letter-spacing:.1em; padding:5px 12px; border-radius:999px; margin-bottom:10px; }
.grande-num { font-family:var(--display); font-weight:700; font-size:64px; line-height:1; margin:6px 0; font-variant-numeric:tabular-nums; }
.datos { color:var(--suave); font-weight:700; margin:0 0 16px; }

#grito { position:fixed; left:50%; top:36%; transform:translate(-50%,-50%); font-family:var(--display); font-weight:700; font-size:48px; color:var(--dorado);
  text-shadow:0 4px 0 var(--rosa-osc), 0 0 30px rgba(255,199,95,.55); pointer-events:none; opacity:0; z-index:4; white-space:nowrap; }
#grito.sale { animation:grito .95s ease-out; }
@keyframes grito { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)} 70%{opacity:1;transform:translate(-50%,-70%) scale(1)} 100%{opacity:0;transform:translate(-50%,-95%) scale(1)} }
</style>
</head>
<body>
<div id="barra">
  <a class="chip" href="../" aria-label="Volver al menú">‹ Menú</a>
  <div class="titulo">Pet<span>ris</span></div>
  <button class="chip ico" id="sonido" aria-label="Sonido">🔊</button>
  <button class="chip ico" id="pausa" aria-label="Pausa">❚❚</button>
</div>

<div id="zona">
  <div id="marco"><canvas id="tablero" aria-label="Tablero de juego"></canvas></div>
  <div id="lado">
    <div class="caja"><small>Sigue</small><canvas id="prox" width="72" height="72"></canvas></div>
    <div class="caja"><small>Puntos</small><b id="puntos">0</b></div>
    <div class="caja"><small>Nivel</small><b id="nivel">1</b></div>
    <div class="caja"><small>Filas</small><b id="filas">0</b></div>
    <div class="caja oro"><small>Récord</small><b id="record">0</b></div>
  </div>
</div>

<div id="controles">
  <button class="btn" id="b-izq" aria-label="Mover a la izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="btn" id="b-der" aria-label="Mover a la derecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="btn grande" id="b-girar" aria-label="Girar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="btn" id="b-bajar" aria-label="Bajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
  <button class="btn" id="b-caer" aria-label="Soltar de golpe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l6 6 6-6M6 12l6 6 6-6M5 21h14"/></svg></button>
</div>

<div id="grito">¡Miau!</div>

<div class="capa ver" id="c-inicio"><div class="carta">
  <img class="portada" src="portada.webp" alt="Petris: el Tetris de nuestras mascotas">
  <div class="reglas">
    <div><b>Toca</b>el tablero para girar</div>
    <div><b>Desliza</b>a los lados para mover</div>
    <div><b>Desliza abajo</b>para soltarla</div>
    <div><b>Fila completa</b>¡miau! o ¡guau!</div>
  </div>
  <a class="boton" href="#" id="empezar" aria-disabled="true">Cargando…</a>
</div></div>

<div class="capa" id="c-pausa"><div class="carta">
  <h2>Pausa</h2><p class="datos">Las mascotas te esperan.</p>
  <a class="boton" href="#" id="seguir">Seguir</a><br><a class="boton vidrio" href="../">Volver al menú</a>
</div></div>

<div class="capa" id="c-fin"><div class="carta">
  <div class="record" id="nuevo-record" hidden>★ NUEVO RÉCORD</div>
  <h2>Se llenó de mascotas</h2>
  <div class="grande-num" id="fin-puntos">0</div>
  <p class="datos" id="fin-datos"></p>
  <a class="boton" href="#" id="otra">Otra vez</a><br><a class="boton vidrio" href="../">Volver al menú</a>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const COLS = 10, ROWS = 20, EXT = 0.42;    // EXT: cuánto puede salirse la imagen del cuadro (orejas, patitas, colas)
const leer = (k, d) => { try { const v = localStorage.getItem("michis-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem("michis-" + k, JSON.stringify(v)); } catch (e) {} };
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- mascotas ---------- */
const MAS = (window.MASCOTAS || []).map(m => {
  const gw = Math.max(...m.celdas.map(c => c[0])) + 1, gh = Math.max(...m.celdas.map(c => c[1])) + 1;
  const set = new Set(m.celdas.map(c => c[0] + "," + c[1]));
  const img = new Image(); img.src = m.src;
  return { ...m, gw, gh, set, img };
});
// Las 7 formas del Tetris. La J es una L en espejo.
const FORMAS = ["I", "O", "T", "S", "Z", "L", "J"];
const opciones = f => f === "J" ? MAS.map((m, i) => [i, true]).filter(([i]) => MAS[i].forma === "L") : MAS.map((m, i) => [i, false]).filter(([i]) => MAS[i].forma === f);

/* ---------- estado ---------- */
let tabla, pieza, siguiente, bolsa = [], puntos, filas, nivel, record = leer("record", 0), jugando = false, pausado = false,
    tCaida = 0, limpiando = null, sonido = leer("sonido", true), C = 24;
const cv = $("#tablero"), g = cv.getContext("2d"), pv = $("#prox"), gp = pv.getContext("2d");

function sacar() {
  if (!bolsa.length) { bolsa = FORMAS.slice(); for (let i = bolsa.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bolsa[i], bolsa[j]] = [bolsa[j], bolsa[i]]; } }
  const f = bolsa.pop(), op = opciones(f), [m, espejo] = op[Math.floor(Math.random() * op.length)];
  return { m, espejo };
}
function crear(s) {
  const M = MAS[s.m], n = Math.max(M.gw, M.gh), dx = Math.floor((n - M.gw) / 2), dy = Math.floor((n - M.gh) / 2);
  const celdas = M.celdas.map(([cx, cy]) => ({ x: (s.espejo ? M.gw - 1 - cx : cx) + dx, y: cy + dy, cx, cy }));
  const top = Math.min(...celdas.map(c => c.y));
  return { m: s.m, espejo: s.espejo, n, r: 0, celdas, x: Math.floor((COLS - n) / 2), y: -top };
}
function choca(p, dx = 0, dy = 0, celdas = p.celdas) {
  return celdas.some(c => { const x = p.x + c.x + dx, y = p.y + c.y + dy; return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && tabla[y][x]); });
}
function girar() {
  if (!pieza || pausado || limpiando) return;
  if (MAS[pieza.m].forma === "O") return;
  const n = pieza.n, nuevas = pieza.celdas.map(c => ({ ...c, x: n - 1 - c.y, y: c.x }));
  for (const [dx, dy] of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[0,1]]) if (!choca(pieza, dx, dy, nuevas)) { pieza.celdas = nuevas; pieza.x += dx; pieza.y += dy; pieza.r = (pieza.r + 1) % 4; sonar("giro"); return; }
}
function mover(dx) { if (pieza && !pausado && !limpiando && !choca(pieza, dx, 0)) { pieza.x += dx; return true; } return false; }
function bajar(manual) {
  if (!pieza || pausado || limpiando) return false;
  if (!choca(pieza, 0, 1)) { pieza.y++; if (manual) sumar(1); return true; }
  fijar(); return false;
}
function soltar() {
  if (!pieza || pausado || limpiando) return;
  let d = 0; while (!choca(pieza, 0, 1)) { pieza.y++; d++; }
  sumar(d * 2); fijar();
}
function fijar() {
  let fuera = false;
  for (const c of pieza.celdas) {
    const x = pieza.x + c.x, y = pieza.y + c.y;
    if (y < 0) { fuera = true; continue; }
    tabla[y][x] = { m: pieza.m, espejo: pieza.espejo, r: pieza.r, cx: c.cx, cy: c.cy };
  }
  pieza = null; sonar("pum");
  if (fuera) return fin();
  const llenas = []; for (let y = 0; y < ROWS; y++) if (tabla[y].every(Boolean)) llenas.push(y);
  if (llenas.length) {
    let perros = 0, total = 0; for (const y of llenas) for (const c of tabla[y]) { total++; if (MAS[c.m].especie === "perro") perros++; }
    limpiando = { filas: llenas, t: performance.now() }; grito(llenas.length, perros > total / 3);
  } else sale();
}
function terminarLimpieza() {
  const llenas = limpiando.filas; limpiando = null;
  for (const y of llenas) { tabla.splice(y, 1); tabla.unshift(Array(COLS).fill(null)); }
  const n = llenas.length; filas += n; sumar([0, 100, 300, 500, 800][n] * nivel);
  nivel = Math.floor(filas / 10) + 1;
  sale();
}
function sale() {
  pieza = crear(siguiente); siguiente = sacar(); pintarProx();
  if (choca(pieza)) { pieza = null; fin(); }
  marcador();
}
function sumar(v) { puntos += v; marcador(); }
function marcador() { $("#puntos").textContent = puntos; $("#nivel").textContent = nivel; $("#filas").textContent = filas; $("#record").textContent = Math.max(record, puntos); }
const velocidad = () => Math.max(90, 820 - (nivel - 1) * 75);

/* ---------- dibujo: cada cuadro muestra su parte de la foto, girada con la pieza ---------- */
function cuadro(ctx, px, py, s, c, alfa = 1) {
  const M = MAS[c.m]; if (!M.img.complete || !M.img.naturalWidth) return;
  const L = !M.set.has((c.cx - 1) + "," + c.cy), R = !M.set.has((c.cx + 1) + "," + c.cy), T = !M.set.has(c.cx + "," + (c.cy - 1)), B = !M.set.has(c.cx + "," + (c.cy + 1));
  const eL = L ? EXT : 0, eR = R ? EXT : 0, eT = T ? EXT : 0, eB = B ? EXT : 0;
  let sx = M.x0 + (c.cx - eL) * M.cw, sy = M.y0 + (c.cy - eT) * M.ch, sw = (1 + eL + eR) * M.cw, sh = (1 + eT + eB) * M.ch;
  let dx = -s / 2 - eL * s, dy = -s / 2 - eT * s, dw = (1 + eL + eR) * s, dh = (1 + eT + eB) * s;
  // recortar a los bordes de la imagen (Safari no dibuja si el recorte se sale)
  const iw = M.img.naturalWidth, ih = M.img.naturalHeight, kx = dw / sw, ky = dh / sh;
  if (sx < 0) { dx -= sx * kx; dw += sx * kx; sw += sx; sx = 0; }
  if (sy < 0) { dy -= sy * ky; dh += sy * ky; sh += sy; sy = 0; }
  if (sx + sw > iw) { const d = sx + sw - iw; sw -= d; dw -= d * kx; }
  if (sy + sh > ih) { const d = sy + sh - ih; sh -= d; dh -= d * ky; }
  if (sw <= 0 || sh <= 0) return;
  ctx.save(); ctx.globalAlpha = alfa; ctx.translate(px + s / 2, py + s / 2); ctx.rotate(c.r * Math.PI / 2); if (c.espejo) ctx.scale(-1, 1);
  ctx.drawImage(M.img, sx, sy, sw, sh, dx, dy, dw, dh); ctx.restore();
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function celdasPieza(p, dy = 0) { return p.celdas.map(c => ({ x: p.x + c.x, y: p.y + c.y + dy, c: { m: p.m, espejo: p.espejo, r: p.r, cx: c.cx, cy: c.cy } })); }
function pintar(ahora) {
  const W = COLS * C, H = ROWS * C;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "rgba(255,255,255,.035)";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g.fillRect(x * C + C / 2 - 1, y * C + C / 2 - 1, 2, 2);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (tabla[y][x]) cuadro(g, x * C, y * C, C, tabla[y][x]);
  if (limpiando) {
    const k = Math.min(1, (ahora - limpiando.t) / 340);
    for (const y of limpiando.filas) { const gr = g.createLinearGradient(0, y * C, W, y * C); gr.addColorStop(0, `rgba(255,199,95,${.15 + .7 * (1 - k)})`); gr.addColorStop(.5, `rgba(255,255,255,${.9 * (1 - k)})`); gr.addColorStop(1, `rgba(255,111,145,${.15 + .7 * (1 - k)})`); g.fillStyle = gr; g.fillRect(0, y * C, W, C); }
    if (k >= 1) terminarLimpieza();
  }
  if (pieza) {
    let d = 0; while (!choca(pieza, 0, d + 1)) d++;
    if (d > 0) { g.save(); g.strokeStyle = "rgba(255,199,95,.45)"; g.fillStyle = "rgba(255,199,95,.06)"; g.lineWidth = 1.5;
      for (const it of celdasPieza(pieza, d)) if (it.y >= 0) { rr(g, it.x * C + 2, it.y * C + 2, C - 4, C - 4, C * .22); g.fill(); g.stroke(); } g.restore(); }
    g.save(); g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 12; g.shadowOffsetY = 4;
    for (const it of celdasPieza(pieza)) cuadro(g, it.x * C, it.y * C, C, it.c);
    g.restore();
  }
}
function pintarProx() {
  const p = crear(siguiente), cs = p.celdas, S = Math.min(16, 56 / Math.max(MAS[p.m].gw, MAS[p.m].gh));
  const minx = Math.min(...cs.map(c => c.x)), maxx = Math.max(...cs.map(c => c.x)), miny = Math.min(...cs.map(c => c.y)), maxy = Math.max(...cs.map(c => c.y));
  const ox = (72 - (maxx - minx + 1) * S) / 2 - minx * S, oy = (72 - (maxy - miny + 1) * S) / 2 - miny * S + 3;
  gp.clearRect(0, 0, 72, 72);
  for (const c of cs) cuadro(gp, ox + c.x * S, oy + c.y * S, S, { m: p.m, espejo: p.espejo, r: 0, cx: c.cx, cy: c.cy });
}

/* ---------- sonidos generados (sin archivos) ---------- */
let audio;
function ctxAudio() { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); return audio; }
function sonar(tipo, n = 1) {
  if (!sonido) return;
  try {
    const a = ctxAudio(), t = a.currentTime;
    if (tipo === "miau") {
      for (let i = 0; i < Math.min(n, 3); i++) {
        const t0 = t + i * .28, o = a.createOscillator(), f = a.createBiquadFilter(), v = a.createGain(), base = 520 + Math.random() * 120 + (n >= 4 ? 120 : 0);
        o.type = "sawtooth"; f.type = "bandpass"; f.Q.value = 3;
        o.frequency.setValueAtTime(base, t0); o.frequency.linearRampToValueAtTime(base * 1.7, t0 + .12); o.frequency.linearRampToValueAtTime(base * 1.05, t0 + .38);
        f.frequency.setValueAtTime(900, t0); f.frequency.linearRampToValueAtTime(2200, t0 + .12); f.frequency.linearRampToValueAtTime(1000, t0 + .38);
        v.gain.setValueAtTime(.0001, t0); v.gain.exponentialRampToValueAtTime(.32, t0 + .05); v.gain.exponentialRampToValueAtTime(.0001, t0 + .42);
        o.connect(f); f.connect(v); v.connect(a.destination); o.start(t0); o.stop(t0 + .45);
      }
    } else if (tipo === "guau") {
      for (let i = 0; i < Math.min(n + 1, 3); i++) {
        const t0 = t + i * .22, o = a.createOscillator(), f = a.createBiquadFilter(), v = a.createGain();
        o.type = "square"; f.type = "bandpass"; f.frequency.value = 700; f.Q.value = 1.4;
        o.frequency.setValueAtTime(260, t0); o.frequency.exponentialRampToValueAtTime(150, t0 + .13);
        v.gain.setValueAtTime(.0001, t0); v.gain.exponentialRampToValueAtTime(.4, t0 + .015); v.gain.exponentialRampToValueAtTime(.0001, t0 + .16);
        o.connect(f); f.connect(v); v.connect(a.destination); o.start(t0); o.stop(t0 + .18);
      }
    } else {
      const o = a.createOscillator(), v = a.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(tipo === "giro" ? 660 : 170, t); o.frequency.exponentialRampToValueAtTime(tipo === "giro" ? 880 : 85, t + .08);
      v.gain.setValueAtTime(tipo === "giro" ? .05 : .12, t); v.gain.exponentialRampToValueAtTime(.0001, t + .1);
      o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + .12);
    }
  } catch (e) {}
}
function grito(n, perro) {
  const el = $("#grito");
  el.textContent = perro ? ["", "¡Guau!", "¡Guau guau!", "¡Guau guau guau!", "¡GUAAAU! 🐾"][n] : ["", "¡Miau!", "¡Miau miau!", "¡Miau miau miau!", "¡MIAUUUU! 🐾"][n];
  el.classList.remove("sale"); void el.offsetWidth; el.classList.add("sale");
  sonar(perro ? "guau" : "miau", n); vibrar(n >= 4 ? [40, 50, 40, 50, 80] : 40);
}

/* ---------- ciclo ---------- */
let antes = 0;
function ciclo(ahora) {
  const dt = Math.min(100, ahora - antes); antes = ahora;
  if (jugando && !pausado && !limpiando && pieza) { tCaida += dt; if (tCaida >= velocidad()) { tCaida = 0; bajar(false); } }
  if (tabla) pintar(ahora);
  requestAnimationFrame(ciclo);
}
function empezar() {
  tabla = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  bolsa = []; puntos = 0; filas = 0; nivel = 1; tCaida = 0; limpiando = null; pausado = false;
  siguiente = sacar(); sale(); jugando = true;
  document.querySelectorAll(".capa").forEach(c => c.classList.remove("ver"));
  if (sonido) try { ctxAudio(); } catch (e) {}
}
function fin() {
  jugando = false; const nuevo = puntos > record && puntos > 0;
  if (nuevo) { record = puntos; guardar("record", record); }
  $("#nuevo-record").hidden = !nuevo;
  $("#fin-puntos").textContent = puntos;
  $("#fin-datos").textContent = filas + (filas === 1 ? " fila" : " filas") + " · nivel " + nivel + " · récord " + record;
  setTimeout(() => $("#c-fin").classList.add("ver"), 380); vibrar([60, 60, 120]); marcador();
}
function pausar(v) { if (!jugando) return; pausado = v; $("#c-pausa").classList.toggle("ver", v); }

/* ---------- tamaño ---------- */
function medir() {
  const zona = $("#zona").getBoundingClientRect(), lado = 84 + 10, marco = 8;
  const porAlto = Math.floor((zona.height - 10 - marco) / ROWS), porAncho = Math.floor((zona.width - lado - marco) / COLS);
  C = Math.max(14, Math.min(porAlto, porAncho, 42));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = COLS * C * dpr; cv.height = ROWS * C * dpr; cv.style.width = COLS * C + "px"; cv.style.height = ROWS * C + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.imageSmoothingQuality = "high";
  pv.width = pv.height = 72 * dpr; pv.style.width = pv.style.height = "72px"; gp.setTransform(dpr, 0, 0, dpr, 0, 0); gp.imageSmoothingQuality = "high";
  if (siguiente) pintarProx();
}
window.addEventListener("resize", medir);

/* ---------- controles ---------- */
function repetir(btn, fn, primera = 170, luego = 55) {
  let t1, t2;
  const parar = () => { clearTimeout(t1); clearInterval(t2); btn.classList.remove("on"); };
  btn.addEventListener("pointerdown", e => { e.preventDefault(); if (!jugando) return; btn.classList.add("on"); fn(); t1 = setTimeout(() => t2 = setInterval(fn, luego), primera); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, parar));
}
repetir($("#b-izq"), () => mover(-1));
repetir($("#b-der"), () => mover(1));
repetir($("#b-bajar"), () => bajar(true), 120, 45);
$("#b-girar").addEventListener("pointerdown", e => { e.preventDefault(); if (jugando) girar(); });
$("#b-caer").addEventListener("pointerdown", e => { e.preventDefault(); if (jugando) soltar(); });

let toque = null;
cv.addEventListener("pointerdown", e => { if (!jugando) return; toque = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(), movio: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!toque || !jugando) return;
  const dx = e.clientX - toque.x, dy = e.clientY - toque.y;
  if (Math.abs(dx) >= C * .8) { mover(dx > 0 ? 1 : -1); toque.x = e.clientX; toque.movio = true; }
  if (dy >= C * .9 && Math.abs(e.clientX - toque.x0) < C * 1.5) { bajar(true); toque.y = e.clientY; toque.movio = true; }
});
cv.addEventListener("pointerup", e => {
  if (!toque || !jugando) return;
  const dt = performance.now() - toque.t, dy = e.clientY - toque.y0, dx = e.clientX - toque.x0;
  if (dy > C * 2.5 && dt < 260 && Math.abs(dx) < C * 1.5) soltar();
  else if (!toque.movio && Math.abs(dx) < 10 && Math.abs(dy) < 10) girar();
  toque = null;
});
document.addEventListener("keydown", e => {
  if (!jugando) { if ((e.key === "Enter" || e.key === " ") && listo) empezar(); return; }
  const k = e.key;
  if (k === "ArrowLeft") mover(-1); else if (k === "ArrowRight") mover(1); else if (k === "ArrowDown") bajar(true);
  else if (k === "ArrowUp" || k === "x") girar(); else if (k === " ") soltar(); else if (k === "p" || k === "Escape") pausar(!pausado); else return;
  e.preventDefault();
});
const click = (sel, fn) => $(sel).addEventListener("click", e => { e.preventDefault(); fn(); });
click("#empezar", () => listo && empezar()); click("#otra", empezar); click("#seguir", () => pausar(false));
click("#pausa", () => pausar(!pausado));
const pintarSonido = () => { $("#sonido").textContent = sonido ? "🔊" : "🔇"; };
click("#sonido", () => { sonido = !sonido; guardar("sonido", sonido); pintarSonido(); if (sonido) sonar("giro"); });
document.addEventListener("visibilitychange", () => { if (document.hidden && jugando && !pausado) pausar(true); });
["gesturestart", "gesturechange", "dblclick"].forEach(t => document.addEventListener(t, ev => ev.preventDefault(), { passive: false }));

let listo = false;
Promise.all(MAS.map(M => M.img.decode ? M.img.decode().catch(() => {}) : new Promise(r => { M.img.onload = M.img.onerror = r; }))).then(() => {
  listo = true; const b = $("#empezar"); b.textContent = "Jugar"; b.removeAttribute("aria-disabled");
});

pintarSonido(); $("#record").textContent = record; medir();
tabla = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
requestAnimationFrame(ciclo);
</script>
