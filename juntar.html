<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Junta nuestras fotos</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <link rel="apple-touch-icon" href="personalizar/fotos/fruta-11.png" />
    <link rel="icon" href="personalizar/fotos/fruta-11.png" />
    <link rel="stylesheet" type="text/css" href="style-mobile.css" />

    <!-- Personalización: textos y fotos (editar SOLO personalizar/config.js) -->
    <script src="personalizar/config.js" charset="utf-8"></script>
    <script>
    (function() {
        var P = window.PERSONALIZAR || {};
        if (P.titulo) document.title = P.titulo;

        // Textos que muestra el juego (los usa src/project.js)
        var t = {
            finDelJuego: "FIN DEL JUEGO", verPuntaje: "Toca para ver tu puntaje", continuar: "Toca para continuar",
            superaste: "¡Superaste al {n}% de los jugadores!", record: "Récord:", empezar: "Empezar",
            jugarOtraVez: "Jugar otra vez", masJuegos: "Más juegos"
        };
        for (var k in (P.textos || {})) t[k] = P.textos[k];
        window.TXT = t;
        window.ENLACE_MAS_JUEGOS = P.enlaceMasJuegos || "";

        // Fotos: cada fruta (de la más chica a la más grande) se reemplaza por la foto del mismo puesto,
        // recortada en círculo y al tamaño exacto de la fruta original (si no, el juego da error).
        var FRUTAS = [
            ["ad16ccdc-975e-4393-ae7b-8ac79c3795f2", 52, 52],   ["0cbb3dbb-2a85-42a5-be21-9839611e5af7", 80, 80],
            ["d0c676e4-0956-4a03-90af-fee028cfabe4", 108, 108], ["74237057-2880-4e1f-8a78-6d8ef00a1f5f", 119, 119],
            ["132ded82-3e39-4e2e-bc34-fc934870f84c", 153, 152], ["03c33f55-5932-4ff7-896b-814ba3a8edb8", 183, 183],
            ["665a0ec9-6c43-4858-974c-025514f2a0e7", 193, 193], ["84bc9d40-83d0-480c-b46a-3ef59e603e14", 258, 258],
            ["5fa0264d-acbf-4a7b-8923-c106ec3b9215", 308, 308], ["564ba620-6a55-4cbe-a5a6-6fa3edd80151", 308, 309],
            ["5035266c-8df3-4236-8d82-a375e97a0d9c", 408, 408]
        ];
        var fotos = P.fotos || [];
        var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        if (!desc || !desc.set) return;

        function enCirculo(foto, w, h) {
            var c = document.createElement("canvas");
            c.width = w; c.height = h;
            var g = c.getContext("2d");
            var lado = Math.min(foto.naturalWidth, foto.naturalHeight);       // lo del centro, cuadrado
            g.beginPath();
            g.arc(w / 2, h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
            g.clip();
            g.drawImage(foto, (foto.naturalWidth - lado) / 2, (foto.naturalHeight - lado) / 2, lado, lado, 0, 0, w, h);
            return c.toDataURL("image/png");
        }

        Object.defineProperty(HTMLImageElement.prototype, "src", {
            configurable: true, enumerable: true,
            get: function() { return desc.get.call(this); },
            set: function(url) {
                var i = -1;
                if (typeof url === "string" && url.indexOf("raw-assets") >= 0) {
                    for (var k = 0; k < FRUTAS.length; k++) if (url.indexOf(FRUTAS[k][0]) >= 0) { i = k; break; }
                }
                if (i < 0 || !fotos[i]) return desc.set.call(this, url);
                var img = this, foto = new Image();
                foto.onload = function() {
                    try { desc.set.call(img, enCirculo(foto, FRUTAS[i][1], FRUTAS[i][2])); }
                    catch (e) { desc.set.call(img, url); }
                };
                foto.onerror = function() { desc.set.call(img, url); };    // foto que no existe: la fruta
                desc.set.call(foto, fotos[i] + (fotos[i].indexOf("?") < 0 ? "?v=" + (P.version || 1) : ""));
            }
        });
    })();
    </script>
</head>

<body style="margin: 0; background: #ddd;" align="center">

    <a href="./" id="al-menu" aria-label="Volver al menú de juegos"
       style="position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:12px;z-index:10;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.88);color:#c7466a;font:800 14px/1 -apple-system,'Segoe UI',Roboto,sans-serif;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.18)">‹ Menú</a>

    <div id="canvasDiv" style="width:100%;height:100%;">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        <div id="block-Box" style="display:block;width:100%;height:100%;"></div>
    </div>

    <div id="loadingText" style="width:100%;display: none;text-align:center;position:absolute;top:45%;z-index:2;font-size:20px;color:#f99f0a">
        Cargando… 0%
    </div>
    <div id="splash"></div>
    <div id="loadingImg" style="top:45%;width: 100%;position:absolute; ">
        <img src="res/loading.gif" width="7%" height="7%" />
    </div>

    <!-- ads.js no muestra anuncios: es la función que abre la escena del juego (noAdGoToScene) -->
    <script type="text/javascript" src="ads.js"></script>

    <script type="text/javascript">
        var preloader;
        var adCompleteFlag = false;
        var resCompleteFlag = false;
        var adEndComplete = false;
        var resEndComplete = false;

        var loadintT = document.getElementById("loadingText");
        var loadintGif = document.getElementById("loadingImg");
        setTimeout(function() {
            loadintGif.remove();
            loadintT.style.display = "";
            updateLabView(0.1);
        }, 1 * 1000);

        window.timer = null;
        window.tempSeconds = 1;
        window.loadData = {};
        loadData.completedCount = 0;
        loadData.totalCount = 0;

        document.getElementById("canvasDiv").style.height = document.documentElement.clientHeight + "px";
        window.onload = function() {
            document.getElementById("block-Box").style.display = "none";
        };

        // Porcentaje de "Cargando…" (aproximado, como en el original)
        function updateLabView(t) {
            if (timer != null) clearInterval(timer);
            timer = setInterval(function() {
                tempSeconds++;
                actualTotal();
                var loadintT = document.getElementById("loadingText");
                if (!loadintT) return;
                loadintT.innerHTML = "Cargando… " + parseInt(tempSeconds) + "%";
                switch (tempSeconds) {
                    case 20: updateLabView(0.2); break;
                    case 40: updateLabView(0.3); break;
                    case 60: updateLabView(0.4); break;
                    case 96: updateLabView(5); break;
                    case 97: updateLabView(10); break;
                    case 98: updateLabView(50); break;
                    case 99: updateLabView(100); break;
                    default: if (tempSeconds >= 80 && tempSeconds < 96) updateLabView(t + 0.1);
                }
                if (tempSeconds > 100) {
                    clearInterval(timer);
                    tempSeconds = 100;
                    loadintT.innerHTML = "Cargando… 100%";
                }
            }, t * 1000);
        }

        function actualTotal() {
            var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
            if (percent > tempSeconds && loadData.totalCount > 1) tempSeconds = percent;
        }
    </script>

    <script src="src/settings.js" charset="utf-8"></script>
    <script src="main.js" charset="utf-8"></script>

    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = function(o) { adsbygoogle.push(o); };
    </script>

    <script type="text/javascript">
        (function() {
            document.getElementById('splash').style.display = 'block';
            var cocos2d = document.createElement('script');
            cocos2d.async = true;
            cocos2d.src = window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js';
            var engineLoaded = function() {
                document.body.removeChild(cocos2d);
                cocos2d.removeEventListener('load', engineLoaded, false);
                cc.sys.language = "en";        // los textos del juego salen de personalizar/config.js
                window.boot();
            };
            cocos2d.addEventListener('load', engineLoaded, false);
            document.body.appendChild(cocos2d);
        })();
    </script>
</body>

</html>
